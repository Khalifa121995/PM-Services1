<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Espace atelier – PM Services</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--navy:#0a2a6b;--blue:#1d4fbf;--mist:#eef3fb;--line:#d4e0f2;--ink:#0a1b3d;--muted:#4a6288}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,"Segoe UI",Arial,sans-serif;background:var(--mist);color:var(--ink);line-height:1.45}
[hidden]{display:none!important}
.w{max-width:1000px;margin:0 auto;padding:0 14px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
textarea{min-height:64px;resize:vertical}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--navy);background:var(--navy);color:#fff;font-weight:700;cursor:pointer}
.btn.o{background:#fff;color:var(--navy)}
label{display:block;font-size:.85rem;font-weight:700;color:var(--navy)}
label input,label select,label textarea{margin-top:4px;font-weight:400}
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:380px}
.box h1{font-size:1.3rem;color:var(--navy);margin-bottom:14px}
.err{color:#b00020;font-weight:600;margin-top:10px;min-height:1.2em}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .w{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:60px;padding-top:8px;padding-bottom:8px}
header h1{font-size:1.1rem;color:var(--navy);margin-right:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 12px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip b{margin-left:6px}
.c{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.top b{font-size:1.05rem;color:var(--navy)}
.top small{color:var(--muted)}
.top select{width:auto;min-width:190px;margin-left:auto;font-weight:700}
.rc{margin:6px 0;padding:10px 12px;background:var(--mist);border:2px dashed var(--navy);border-radius:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.rc small{color:var(--muted);flex:1;min-width:160px}.rc strong{font-size:1.5rem;letter-spacing:.06em;color:var(--navy);user-select:all}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stats div{background:var(--mist);border-radius:10px;padding:8px 10px;color:var(--muted);font-size:.85rem}.stats b{display:block;color:var(--ink);font-size:1.05rem}
.solde{margin:10px 0 4px;padding:10px 12px;border-radius:10px;background:var(--navy);color:#fff;font-size:1.1rem}.solde b{font-size:1.4rem}.solde.neg{background:#b00020}
.co{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px}.co small{color:var(--muted);display:block}
.src{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700}
.src.web{background:#e3f0ff;color:#0a4fbf;border:1px solid #9cc2f5}.src.at{background:#e6f6ec;color:#0a6a3a;border:1px solid #9bd5b4}
.c.web{border-left:6px solid #1d4fbf}.c.at{border-left:6px solid #0a8a4a}
.st-recu{border-color:#c9a400}.st-diagnostic,.st-cours{border-color:var(--blue)}.st-piece{border-color:#d9731a}.st-pret{border-color:#0a8a4a}.st-livre{border-color:#8896ad}.st-annule{border-color:#b00020}
.row{display:grid;grid-template-columns:1fr 1fr 2fr;gap:10px;margin-top:10px}
.c a{color:var(--blue);font-weight:700}
details{margin-top:6px;color:var(--muted)}
summary{cursor:pointer;color:var(--navy);font-weight:700}
details p{margin-top:4px;color:var(--ink)}
dialog{border:0;border-radius:16px;padding:20px;width:min(480px,94vw)}
dialog::backdrop{background:rgb(6 24 63/50%)}
.g{display:grid;gap:10px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.tabs{display:flex;gap:8px;margin-top:16px}
.tab{flex:1;min-height:44px;border:2px solid var(--line);background:#fff;border-radius:12px;font-weight:700;cursor:pointer;color:var(--navy)}
.tab[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.pg{margin-top:18px;color:var(--navy);font-size:1.05rem}
.pr{display:grid;grid-template-columns:1fr 130px auto;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px}
.pr small{color:var(--muted);display:block}
.pr input{min-height:40px}
.pr .acts{display:flex;gap:6px}
.mini{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer;color:var(--navy)}
.mini.d{color:#b00020}
@media(max-width:600px){.pr{grid-template-columns:1fr}}
@media(max-width:600px){.row{grid-template-columns:1fr}.top select{width:100%;margin-left:0}}
.pcs{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:8px}.pcs legend{font-size:.85rem;font-weight:700;color:var(--navy);padding:0 4px}
.ck{display:flex;gap:8px;align-items:center}.ck input{width:auto;min-height:0;margin:0;accent-color:var(--navy)}
.pp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.hint{grid-column:1/-1;color:var(--muted);font-weight:400}
#ntot{background:var(--mist);border-radius:10px;padding:8px 10px}
</style>
</head>
<body>
<main id="login">
 <form class="box" id="lf">
  <h1>Espace atelier PM Services</h1>
  <label>Mot de passe<input type="password" id="pw" autocomplete="current-password" required></label>
  <p class="err" id="le" role="alert"></p>
  <button class="btn" type="submit" style="width:100%;margin-top:6px">Se connecter</button>
 </form>
</main>

<div id="app" hidden>
 <header><div class="w">
  <h1>PM Services · Réparations</h1>
  <button class="btn" id="nb" type="button">+ Nouvelle réparation</button>
  <button class="btn o" id="rf" type="button">Actualiser</button>
  <button class="btn o" id="rp" type="button">Envoyer le rapport</button>
  <button class="btn o" id="lo" type="button">Déconnexion</button>
 </div></header>
 <div class="w">
  <div class="tabs"><button class="tab" id="t1" type="button" aria-pressed="true">Réparations</button><button class="tab" id="t2" type="button" aria-pressed="false">Prix</button><button class="tab" id="t3" type="button" aria-pressed="false">Caisse</button></div>
  <p class="err" id="ae" role="alert"></p>
  <section id="v1">
   <div class="chips" id="chips"></div>
   <div class="tabs" id="srcs" style="margin-top:0;margin-bottom:10px"><button class="tab" type="button" data-s="" aria-pressed="true">Toutes origines</button><button class="tab" type="button" data-s="en_ligne" aria-pressed="false">🌐 Commandées en ligne</button><button class="tab" type="button" data-s="atelier" aria-pressed="false">🏪 Enregistrées à l’atelier</button></div>
   <label>Rechercher<input id="q" placeholder="Code, nom, téléphone, modèle…" autocomplete="off"></label>
   <div id="list" aria-live="polite"></div>
  </section>
  <section id="v2" hidden>
   <div style="display:flex;gap:8px;align-items:end;margin-top:16px;flex-wrap:wrap">
    <label style="flex:1;min-width:200px">Rechercher un prix<input id="pq" placeholder="Modèle, marque, pièce…" autocomplete="off"></label>
    <button class="btn" id="pa" type="button">+ Ajouter un prix</button></div>
   <div id="plist"></div>
  </section>
  <section id="v3" hidden>
   <div id="cs" style="margin-top:16px"></div>
   <form class="c g" id="cf"><h3 style="color:var(--navy)">Sortie de caisse</h3>
    <label>Montant (F)<input id="ca" type="number" min="1" step="500" inputmode="numeric" required></label>
    <label>Motif<input id="cr" placeholder="Ex. Achat de pièces, transport, repas…" maxlength="120" required></label>
    <p class="err" id="ce" role="alert"></p>
    <button class="btn" type="submit">Enregistrer la sortie</button></form>
   <h3 class="pg">Sorties d’aujourd’hui</h3><div id="clist"></div>
   <details style="margin-top:14px"><summary>Sorties de tout le mois</summary><div id="cmon"></div></details>
   <div style="margin-top:16px"><button class="btn o" id="rm" type="button">Envoyer le rapport du mois</button></div>
  </section>
  <p style="height:40px"></p>
 </div>
</div>

<dialog id="pd">
 <form class="g" id="pf">
  <h2 style="color:var(--navy)" id="pdt">Prix</h2>
  <input type="hidden" id="pid">
  <label>Pièce<input id="ppc" list="pcs" placeholder="Écran, Vitre arrière, Coque complète…" required></label>
  <label>Marque<input id="pbr" list="brs" placeholder="Apple, Samsung…" required></label>
  <label>Modèle(s)<input id="plb" placeholder="Ex. iPhone 13 / 13 MINI" required></label>
  <label>Qualité (facultatif)<input id="pql" placeholder="Standard, Original, 2e qualité…"></label>
  <label>Prix (F)<input id="ppr" type="number" min="0" step="500" inputmode="numeric" required></label>
  <label>Modèles d’une catégorie (facultatif, séparés par des virgules)<textarea id="pmo" placeholder="Ex. Samsung A12, Redmi 9A, Tecno Hot 12i"></textarea></label>
  <datalist id="pcs"></datalist><datalist id="brs"></datalist>
  <p class="err" id="pe" role="alert"></p>
  <div style="display:flex;gap:8px"><button class="btn" type="submit" style="flex:1">Enregistrer</button><button class="btn o" type="button" id="pc">Annuler</button></div>
 </form>
</dialog>

<dialog id="nd">
 <form class="g" id="nf">
  <h2 style="color:var(--navy)">Nouvelle réparation</h2>
  <label>Nom du client<input id="nn" autocomplete="off"></label>
  <label>Téléphone<input id="nt" inputmode="tel" required></label>
  <label>E-mail du client (facultatif)<input id="nem" type="email"></label>
  <label>Marque<input id="nbr" placeholder="Ex. Apple"></label>
  <label>Modèle<input id="nm" placeholder="Ex. iPhone 13" required></label>
  <fieldset class="pcs"><legend>Réparations (cochez)</legend>
   <div class="it" data-p="Écran"><label class="ck"><input type="checkbox"> Écran</label><div class="pp" hidden><label>Vente (F)<input type="number" min="0" step="500" inputmode="numeric" data-k="sale"></label><label>Achat (F)<input type="number" min="0" step="500" inputmode="numeric" data-k="cost"></label><small class="hint"></small></div></div>
   <div class="it" data-p="Vitre arrière"><label class="ck"><input type="checkbox"> Vitre arrière</label><div class="pp" hidden><label>Vente (F)<input type="number" min="0" step="500" inputmode="numeric" data-k="sale"></label><label>Achat (F)<input type="number" min="0" step="500" inputmode="numeric" data-k="cost"></label><small class="hint"></small></div></div>
   <div class="it" data-p="Coque complète"><label class="ck"><input type="checkbox"> Ensemble (coque complète)</label><div class="pp" hidden><label>Vente (F)<input type="number" min="0" step="500" inputmode="numeric" data-k="sale"></label><label>Achat (F)<input type="number" min="0" step="500" inputmode="numeric" data-k="cost"></label><small class="hint"></small></div></div>
   <div class="it" data-p="Autre"><label class="ck"><input type="checkbox"> Autre</label><div class="pp" hidden><label style="grid-column:1/-1">Précisez<input data-k="label" placeholder="Ex. Batterie, connecteur…"></label><label>Vente (F)<input type="number" min="0" step="500" inputmode="numeric" data-k="sale"></label><label>Achat (F)<input type="number" min="0" step="500" inputmode="numeric" data-k="cost"></label></div></div>
  </fieldset>
  <p id="ntot"></p>
  <label>Panne<textarea id="ni"></textarea></label>
  <p class="err" id="ne" role="alert"></p>
  <div style="display:flex;gap:8px"><button class="btn" type="submit" style="flex:1">Enregistrer</button><button class="btn o" type="button" id="nc">Annuler</button></div>
 </form>
</dialog>
<div id="toast" role="status"></div>

<script>
const ST={recu:"Reçue",diagnostic:"En diagnostic",piece:"En attente de pièce",cours:"En réparation",pret:"Prête à récupérer",livre:"Livrée",annule:"Annulée"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let rows=[],filter="actives",src="";
const MSG={password:"Mot de passe incorrect.",config:"Le serveur n’est pas configuré (DATABASE_URL ou ADMIN_PASSWORD manquant sur Vercel).",db:"Erreur de base de données."};

async function api(action,data){
 const r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({action},data))});
 const j=await r.json().catch(()=>({}));
 if(r.status===401&&action!=="login"){show(false);throw new Error("auth")}
 if(!r.ok)throw new Error(j.error||("http"+r.status));
 return j}
function show(on){$("login").hidden=on;$("app").hidden=!on}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)}
const fmt=d=>new Date(d).toLocaleString("fr-FR",{timeZone:"Africa/Abidjan",dateStyle:"short",timeStyle:"short"});

function chips(){
 const base=rows.filter(r=>!src||r.source===src);
 const n=k=>base.filter(r=>r.status===k).length;
 const act=base.filter(r=>r.status!=="livre"&&r.status!=="annule").length;
 const list=[["actives","En cours",act],...Object.keys(ST).map(k=>[k,ST[k],n(k)]),["tous","Toutes",base.length]];
 $("chips").innerHTML=list.map(([k,l,c])=>`<button type="button" class="chip" data-k="${k}" aria-pressed="${filter===k}">${esc(l)}<b>${c}</b></button>`).join("")}
function visible(){
 const q=$("q").value.trim().toLowerCase();
 return rows.filter(r=>(!src||r.source===src)&&(filter==="tous"||(filter==="actives"?r.status!=="livre"&&r.status!=="annule":r.status===filter))&&
  (!q||[r.code,r.name,r.phone,r.brand,r.model,r.piece].join(" ").toLowerCase().includes(q)))}
function card(r){
 const map=r.lat!=null?`https://www.google.com/maps?q=${r.lat},${r.lng}`:(r.address?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([r.address,r.city].filter(Boolean).join(", "))}`:"");
 const dom=r.kind==="domicile";
 const web=r.source==="en_ligne",at=r.source==="atelier";
 const badge=web?'<span class="src web">🌐 Commandée en ligne</span>':at?'<span class="src at">🏪 Enregistrée à l’atelier</span>':"";
 return `<article class="c st-${esc(r.status)} ${web?"web":at?"at":""}" data-id="${r.id}">
 <div class="top"><b>${esc(r.code)}</b>${badge}<small>${esc(fmt(r.created_at))}${web?" · "+(dom?"À domicile":"Dépôt à l’atelier"):""}</small>
  <select data-f="status" aria-label="État de la réparation">${Object.keys(ST).map(k=>`<option value="${k}"${k===r.status?" selected":""}>${esc(ST[k])}</option>`).join("")}</select></div>
 <div>${esc(r.name||"Client")} · <a href="tel:${esc(String(r.phone).replace(/[^\d+]/g,""))}">${esc(r.phone)}</a></div>
 ${r.email?`<div><small>✉ ${esc(r.email)} (prévenu à chaque changement d’état)</small></div>`:`<div><small>Pas d’e-mail : le client ne sera pas prévenu</small></div>`}
 <div>${esc([r.brand,r.model].filter(Boolean).join(" "))}${r.piece?" – "+esc(r.piece):""}</div>
 <details><summary>Détails</summary>
  <div class="rc"><small>Code de la réparation à écrire sur le reçu du client</small><strong>${esc(r.code)}</strong><button type="button" class="mini" data-copy="${esc(r.code)}">Copier</button></div>
  <p><b>Panne :</b> ${esc(r.issue||"—")}</p>
  ${dom?`<p><b>Adresse :</b> ${esc([r.address,r.city].filter(Boolean).join(", "))}${r.slot?" · "+esc(r.slot):""}</p>`:""}
  ${map?`<p><a href="${esc(map)}" target="_blank" rel="noopener">Ouvrir la carte</a></p>`:""}
  ${itemsHtml(r)}
  <p><small>Mis à jour le ${esc(fmt(r.updated_at))}</small></p></details>
 <div class="row"><label>Prix client (F)<input type="number" min="0" step="500" inputmode="numeric" data-f="price" value="${r.price??""}"></label>
  <label>Achat (F)<input type="number" min="0" step="500" inputmode="numeric" data-f="cost" value="${r.cost??""}">${r.price!=null&&r.cost!=null?`<small style="font-weight:400">Marge : ${F(r.price-r.cost)} F</small>`:""}</label>
  <label>Note interne<textarea data-f="note">${esc(r.note||"")}</textarea></label></div>
 <div style="margin-top:10px"><button type="button" class="mini d" data-del="1">Supprimer cette réparation</button></div></article>`}
function render(){
 chips();const v=visible();
 $("list").innerHTML=v.length?v.map(card).join(""):'<p style="margin-top:20px;color:var(--muted)">Aucune réparation dans cette vue.</p>'}

async function load(){
 try{rows=(await api("list")).rows;$("ae").textContent="";render()}
 catch(e){if(e.message!=="auth")$("ae").textContent=MSG[e.message]||"Chargement impossible ("+e.message+")."}}

$("list").addEventListener("change",async e=>{
 const t=e.target,f=t.dataset.f,art=t.closest("article");if(!f||!art)return;
 const id=Number(art.dataset.id),val=t.value;
 try{const j=await api("update",{id,[f]:val});
  const i=rows.findIndex(r=>r.id===id);if(i>-1)rows[i]=j.row;
  let msg=f==="status"?(j.mail==="sent"?"✓ Enregistré · e-mail envoyé au client":j.mail==="failed"?"Enregistré, mais l’e-mail n’a pas pu partir":"✓ Enregistré (pas d’e-mail client)"):"✓ Enregistré";
  toast(msg);
  if(f==="status"){art.className="c st-"+j.row.status+(j.row.source==="en_ligne"?" web":j.row.source==="atelier"?" at":"");chips()}}
 catch(x){if(x.message!=="auth"){toast("Échec de l’enregistrement");load()}}});
$("list").addEventListener("click",async e=>{
 const cp=e.target.closest("button[data-copy]");if(cp){const c=cp.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>toast("✓ Code "+c+" copié"),()=>toast("Code : "+c));return}
 const b=e.target.closest("button[data-del]");if(!b)return;
 const art=b.closest("article"),id=Number(art.dataset.id),r=rows.find(x=>x.id===id);if(!r)return;
 if(!confirm("Supprimer définitivement la réparation "+r.code+" ("+(r.name||"client")+") ?\nCette action est irréversible."))return;
 try{const j=await api("delete",{id});rows=rows.filter(x=>x.id!==id);render();
  toast("✓ Réparation supprimée")}
 catch(x){if(x.message!=="auth")toast("Suppression impossible ("+x.message+")")}});
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;filter=b.dataset.k;render()};
$("q").oninput=render;
$("srcs").onclick=e=>{const b=e.target.closest("button[data-s]");if(!b)return;src=b.dataset.s;document.querySelectorAll("#srcs .tab").forEach(x=>x.setAttribute("aria-pressed",x===b));render()};
$("rf").onclick=()=>tab===3?loadCash():load();
$("lo").onclick=async()=>{try{await api("logout")}catch(e){}show(false)};
$("lf").onsubmit=async e=>{e.preventDefault();$("le").textContent="";
 try{await api("login",{password:$("pw").value});$("pw").value="";show(true);load()}
 catch(x){$("le").textContent=MSG[x.message]||"Connexion impossible ("+x.message+")."}};
$("nb").onclick=()=>{$("nf").reset();$("ne").textContent="";$("nd").showModal();autoFill();
 if(!prices.length)api("price_list").then(j=>{prices=j.rows;autoFill()}).catch(()=>{})};
$("rp").onclick=async()=>{try{const j=await api("report_now");toast("✓ Rapport envoyé ("+j.count+" réparation(s))")}catch(x){if(x.message!=="auth")toast("Rapport non envoyé ("+x.message+")")}};
function itemsHtml(r){let a=[];try{a=JSON.parse(r.items||"[]")}catch{}
 return a.length?`<p><b>Réparations :</b> ${a.map(i=>esc(i.piece)+" – "+F(i.sale)+" F (achat "+F(i.cost)+" F)").join(" · ")}</p>`:""}
function sug(piece){const m=$("nm").value.trim().toLowerCase();if(!m)return null;let best=null,sc=0;
 for(const r of prices.filter(x=>x.piece===piece)){
  const segs=r.label.toLowerCase().split("/").concat((r.models||"").toLowerCase().split(",")).map(s=>s.trim()).filter(Boolean);
  for(const s of segs){const v=s===m?1000:(m.includes(s)?s.length:0);if(v>sc){sc=v;best=r}}}
 return best}
function autoFill(){let s=0,c=0;
 document.querySelectorAll("#nd .it").forEach(el=>{const on=el.querySelector(".ck input").checked;el.querySelector(".pp").hidden=!on;if(!on)return;
  const sale=el.querySelector("[data-k=sale]"),h=el.querySelector(".hint");
  if(h){const r=el.dataset.p==="Autre"?null:sug(el.dataset.p);h.textContent=r?"Prix en base : "+F(r.price)+" F ("+r.label+")":"";
   if(r&&(sale.value===""||sale.dataset.auto)){sale.value=r.price;sale.dataset.auto="1"}}
  s+=+sale.value||0;c+=+el.querySelector("[data-k=cost]").value||0});
 $("ntot").innerHTML=`Total client : <b>${F(s)} F</b> · Achat : ${F(c)} F · Marge : <b>${F(s-c)} F</b>`}
function getItems(){return [...document.querySelectorAll("#nd .it")].filter(el=>el.querySelector(".ck input").checked).map(el=>({
 piece:el.dataset.p==="Autre"?(el.querySelector("[data-k=label]").value.trim()||"Autre"):el.dataset.p,
 sale:el.querySelector("[data-k=sale]").value,cost:el.querySelector("[data-k=cost]").value}))}
$("nd").addEventListener("input",e=>{if(e.target.dataset.k==="sale")delete e.target.dataset.auto;autoFill()});
$("nc").onclick=()=>$("nd").close();
$("nf").onsubmit=async e=>{e.preventDefault();
 try{const items=getItems();const j=await api("create",{name:$("nn").value,phone:$("nt").value,email:$("nem").value,brand:$("nbr").value,model:$("nm").value,items,issue:$("ni").value});
  $("nd").close();toast("✓ Dossier créé : "+j.code);filter="actives";load()}
 catch(x){$("ne").textContent=x.message==="invalid"?"Téléphone et modèle obligatoires.":"Création impossible ("+x.message+")."}};
/* onglets */
let prices=[],tab=1;
function setTab(n){tab=n;[1,2,3].forEach(i=>{$("v"+i).hidden=n!==i;$("t"+i).setAttribute("aria-pressed",n===i)});if(n===2)loadPrices();if(n===3)loadCash()}
$("t1").onclick=()=>setTab(1);$("t2").onclick=()=>setTab(2);$("t3").onclick=()=>setTab(3);
/* caisse */
let cash=null;
async function loadCash(){
 try{cash=await api("cash_summary");$("ae").textContent="";renderCash()}
 catch(e){if(e.message!=="auth")$("ae").textContent="Chargement de la caisse impossible ("+e.message+")."}}
function statsHtml(t,l,s,extra){return `<div class="c"${extra||""}><h3 style="color:var(--navy);margin-bottom:8px">${t}</h3><div class="stats">
 <div>Ventes<b>${F(s.sales)} F</b></div><div>Achats<b>${F(s.cost)} F</b></div><div>Marge<b>${F(s.margin)} F</b></div><div>Sorties de caisse<b>− ${F(s.out)} F</b></div></div>
 <p class="solde${s.solde<0?" neg":""}">${l} : <b>${F(s.solde)} F</b></p><small style="color:var(--muted)">${s.count} réparation(s) · solde = ventes − achats − sorties</small></div>`}
function outsList(a){return a.length?a.slice().reverse().map(o=>`<div class="co" data-id="${o.id}"><div><b>${esc(o.reason)}</b><small>${esc(fmt(o.created_at))}</small></div><b>− ${F(o.amount)} F</b><button type="button" class="mini d" data-cdel="1">Suppr.</button></div>`).join(""):'<p style="margin-top:8px;color:var(--muted)">Aucune sortie.</p>'}
function renderCash(){if(!cash)return;
 $("cs").innerHTML=statsHtml("Aujourd’hui","Solde de la journée",cash.day)+statsHtml("Ce mois-ci","Solde du mois",cash.month,' style="margin-top:10px"');
 $("clist").innerHTML=outsList(cash.day.outs);$("cmon").innerHTML=outsList(cash.month.outs)}
$("cf").onsubmit=async e=>{e.preventDefault();$("ce").textContent="";
 try{await api("cash_add",{amount:$("ca").value,reason:$("cr").value});$("cf").reset();toast("✓ Sortie enregistrée");loadCash()}
 catch(x){if(x.message!=="auth")$("ce").textContent=x.message==="invalid"?"Indiquez un montant et un motif.":"Enregistrement impossible ("+x.message+")."}};
$("v3").addEventListener("click",async e=>{
 const b=e.target.closest("button[data-cdel]");if(!b)return;
 if(!confirm("Supprimer cette sortie de caisse ?"))return;
 try{await api("cash_delete",{id:Number(b.closest(".co").dataset.id)});toast("✓ Sortie supprimée");loadCash()}
 catch(x){if(x.message!=="auth")toast("Suppression impossible ("+x.message+")")}});
$("rm").onclick=async()=>{try{const j=await api("report_month");toast("✓ Rapport du mois envoyé ("+j.count+" réparation(s))")}catch(x){if(x.message!=="auth")toast("Rapport non envoyé ("+x.message+")")}};
const F=n=>new Intl.NumberFormat("fr-FR").format(n);
async function loadPrices(){
 try{prices=(await api("price_list")).rows;$("ae").textContent="";renderPrices()}
 catch(e){if(e.message!=="auth")$("ae").textContent="Chargement des prix impossible ("+e.message+")."}}
function renderPrices(){
 const q=$("pq").value.trim().toLowerCase();
 const v=prices.filter(r=>!q||[r.piece,r.brand,r.label,r.quality,r.models].join(" ").toLowerCase().includes(q));
 $("pcs").innerHTML=[...new Set(prices.map(r=>r.piece))].map(x=>`<option value="${esc(x)}">`).join("");
 $("brs").innerHTML=[...new Set(prices.map(r=>r.brand))].map(x=>`<option value="${esc(x)}">`).join("");
 let out="",last="";
 for(const r of v){const g=r.piece+" · "+r.brand;
  if(g!==last){out+=`<h3 class="pg">${esc(g)}</h3>`;last=g}
  out+=`<div class="pr" data-id="${r.id}"><div><b>${esc(r.label)}</b>${r.quality?" – "+esc(r.quality):""}${r.models?`<small>${esc(r.models)}</small>`:""}</div>
   <label style="font-size:.78rem">Prix (F)<input type="number" min="0" step="500" inputmode="numeric" data-p="price" value="${r.price}"></label>
   <div class="acts"><button type="button" class="mini" data-a="edit">Modifier</button><button type="button" class="mini d" data-a="del">Suppr.</button></div></div>`}
 $("plist").innerHTML=out||'<p style="margin-top:20px;color:var(--muted)">Aucun prix.</p>'}
$("pq").oninput=renderPrices;
$("plist").addEventListener("change",async e=>{
 const t=e.target;if(t.dataset.p!=="price")return;
 const r=prices.find(x=>x.id===Number(t.closest(".pr").dataset.id));if(!r)return;
 try{const j=await api("price_save",Object.assign({},r,{price:t.value}));Object.assign(r,j.row);toast("✓ Prix mis à jour : "+F(j.row.price)+" F")}
 catch(x){if(x.message!=="auth"){toast("Échec de l’enregistrement");loadPrices()}}});
$("plist").addEventListener("click",async e=>{
 const b=e.target.closest("button[data-a]");if(!b)return;
 const r=prices.find(x=>x.id===Number(b.closest(".pr").dataset.id));if(!r)return;
 if(b.dataset.a==="edit"){openPrice(r)}
 else if(confirm("Supprimer « "+r.label+" » ?")){try{await api("price_delete",{id:r.id});prices=prices.filter(x=>x!==r);renderPrices();toast("✓ Prix supprimé")}catch(x){if(x.message!=="auth")toast("Suppression impossible")}}});
function openPrice(r){
 $("pdt").textContent=r?"Modifier le prix":"Ajouter un prix";$("pe").textContent="";
 $("pid").value=r?r.id:"";$("ppc").value=r?r.piece:"Écran";$("pbr").value=r?r.brand:"";$("plb").value=r?r.label:"";
 $("pql").value=r&&r.quality||"";$("ppr").value=r?r.price:"";$("pmo").value=r&&r.models||"";$("pd").showModal()}
$("pa").onclick=()=>openPrice(null);$("pc").onclick=()=>$("pd").close();
$("pf").onsubmit=async e=>{e.preventDefault();
 try{await api("price_save",{id:$("pid").value,piece:$("ppc").value,brand:$("pbr").value,label:$("plb").value,quality:$("pql").value,price:$("ppr").value,models:$("pmo").value});
  $("pd").close();toast("✓ Prix enregistré");loadPrices()}
 catch(x){$("pe").textContent=x.message==="exists"?"Ce prix existe déjà (même pièce, marque, modèle et qualité).":x.message==="invalid"?"Remplissez pièce, marque, modèle et prix.":"Enregistrement impossible ("+x.message+")."}};
setInterval(()=>{const a=document.activeElement;if(!$("app").hidden&&!$("nd").open&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))load()},60000);
/* session déjà ouverte ? */
api("list").then(j=>{rows=j.rows;show(true);render()}).catch(()=>{});
</script>
</body>
</html>
